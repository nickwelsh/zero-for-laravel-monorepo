[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act, cond, eft

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = r.dom == p.dom && r.obj.type == p.obj && r.act == p.act && g(r.sub.key, p.sub, r.dom) && (p.cond == "any" || (p.cond == "owner" && r.obj.owner_id == r.sub.id) || (p.cond == "department" && r.obj.department_id == r.sub.department_id))
