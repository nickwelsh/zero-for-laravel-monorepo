packages:
  - apps/*
  - packages/*
  - examples/*
minimumReleaseAgeExclude:
  - '@rocicorp/zero@1.11.4'
  - '@nickwelsh/docs-base@1.1.0'
  - '@nickwelsh/refquill-darwin-arm64@0.1.0'
  - '@nickwelsh/refquill-fumadocs@0.1.0'
  - '@nickwelsh/refquill-linux-arm64@0.1.0'
  - '@nickwelsh/refquill-linux-x64@0.1.0'
  - '@nickwelsh/refquill-schema@0.1.0'
  - '@nickwelsh/refquill-win32-x64@0.1.0'
  - '@nickwelsh/refquill@0.1.0'
  - '@formbraid/core@0.2.0 || 0.3.0'
  - '@formbraid/react@0.2.0 || 0.3.0'
  - '@nickwelsh/threeslash@0.0.6'
allowBuilds:
  typesense-instantsearch-adapter: false
  esbuild: true
  workerd: true
  '@rocicorp/zero-sqlite3': true
  protobufjs: false
# Vite+ wraps Vite with its own version while providing the Vite API Vitest expects.
peerDependencyRules:
  allowedVersions:
    '@vitest/mocker>vite': '1.2.0'
    'vitest>vite': '1.2.0'
    '@rolldown/plugin-babel>vite': '1.2.0'
    '@vitejs/plugin-react>vite': '1.2.0'
    'laravel-vite-plugin>vite': '1.2.0'
    '@inertiajs/vite>vite': '1.2.0'
    '@tailwindcss/vite>vite': '1.2.0'
publicHoistPattern:
  - '@inertiajs/core'

# Upstream pins still include vulnerable transitive dependencies. Keep these
# targeted fixes until the upstream dependency ranges adopt patched versions.
overrides:
  '@rocicorp/zero>@opentelemetry/auto-instrumentations-node': 0.79.0
  '@opentelemetry/core@<2.8.0': 2.9.0
  '@opentelemetry/propagator-jaeger@<2.9.0': 2.9.0
  'cloudevents>uuid': 11.1.1
  'tinypool@<2.1.2': 2.1.2
  'markdownlint-cli2>smol-toml': 1.9.0
  'micromark-extension-math>katex': 0.18.2
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'zod@>=4.0.0 <4.6.6': 4.6.7
  'markdown-it@>=15.0.0 <15.0.3': 15.0.3
  'glob@>=9.0.0 <14.0.2': 14.0.3
  'minimatch@>=7.0.0 <11.0.1': 11.0.4

# TypeDoc compatibility with the patched minimatch 11 public API.
# Waku API request handling and memory-bounded docs static generation.
patchedDependencies:
  typedoc@0.28.20: apps/docs/patches/typedoc@0.28.20.patch
  waku@1.0.0-rc.3: apps/docs/patches/waku@1.0.0-rc.3.patch
