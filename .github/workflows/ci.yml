name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  example-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: composer --working-dir=examples/todos install --no-dev --no-interaction --prefer-dist
      - run: php examples/todos/artisan wayfinder:generate --with-form
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: example-imports
          path: |
            examples/todos/resources/js/actions
            examples/todos/resources/js/routes
            examples/todos/resources/js/wayfinder

  verify:
    needs: example-imports
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_zero_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZERO_TEST_PG_DATABASE: laravel_zero_test
      ZERO_TEST_PG_USER: postgres
      ZERO_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install validation prerequisites
        run: sudo apt-get update && sudo apt-get install --yes aspell aspell-en lsof postgresql-client
      - name: Enable logical replication for live integration tests
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d laravel_zero_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level = 'logical'"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -U postgres -d laravel_zero_test; then
              break
            fi
            sleep 1
          done
          test "$(psql -h 127.0.0.1 -U postgres -d laravel_zero_test -Atc 'SHOW wal_level')" = logical
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, mbstring
          coverage: ${{ matrix.php == '8.3' && matrix.laravel == '^13.0' && 'xdebug' || 'none' }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: composer --working-dir=packages/laravel validate --strict
      - run: composer --working-dir=packages/laravel update --with 'laravel/framework:${{ matrix.laravel }}' --with 'orchestra/testbench:${{ matrix.testbench }}' --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: example-imports
          path: examples/todos/resources/js
      - run: pnpm --filter @nickwelsh/zero-for-laravel build
      - run: pnpm check
      - run: pnpm test:integration
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
      - run: pnpm --filter @zero-for-laravel/docs deploy:check
      - run: pnpm test:coverage
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
      - run: pnpm php:test:coverage
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        env:
          XDEBUG_MODE: coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.php == '8.3' && matrix.laravel == '^13.0'
        with:
          name: coverage
          path: |
            coverage/client
            packages/laravel/coverage
