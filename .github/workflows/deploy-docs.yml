name: Deploy docs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to deploy (must match npm latest)
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  await-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Wait for npm approval
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          import { existsSync, readFileSync } from 'node:fs';
          const paths = ['packages/client/package.json', 'packages/table/package.json'].filter(existsSync);
          const packages = paths.map(path => JSON.parse(readFileSync(path, 'utf8')));
          if (process.env.RELEASE_TAG !== `v${packages[0].version}` || packages.some(pkg => pkg.version.includes('-'))) {
            throw new Error('Docs require the matching stable release commit.');
          }
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const versions = await Promise.all(packages.map(async pkg => {
                const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/latest`, {
                  signal: AbortSignal.timeout(15_000),
                });
                if (!response.ok) throw new Error(`${pkg.name}: npm returned ${response.status}`);
                return (await response.json()).version;
              }));
              if (packages.every((pkg, index) => pkg.version === versions[index])) process.exit(0);
              console.log(`Waiting for package approval: ${packages.map((pkg, index) => `${pkg.name}@${pkg.version} (latest ${versions[index]})`).join(', ')}.`);
            } catch (error) {
              console.log(`Cannot confirm npm publication: ${error.message}`);
            }
            await setTimeout(60_000);
          }
          throw new Error('Approve the staged npm versions, then rerun failed jobs to deploy docs.');
          JS

  deploy:
    needs: await-publication
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://docs.nickwelsh.me/zero-for-laravel/
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter @zero-for-laravel/docs deploy:check
      - name: Confirm docs still match the current npm release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          const paths = ['packages/client/package.json', 'packages/table/package.json'].filter(existsSync);
          const packages = paths.map(path => JSON.parse(readFileSync(path, 'utf8')));
          if (process.env.RELEASE_TAG !== `v${packages[0].version}`) throw new Error('Release tag mismatch.');
          for (const { name, version } of packages) {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/latest`, {
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`${name}: npm returned ${response.status}`);
            const published = await response.json();
            if (version.includes('-') || published.version !== version) {
              throw new Error(`Refusing to deploy docs before ${name}@${version} is the current stable npm release.`);
            }
          }
          JS
      - run: pnpm --filter @zero-for-laravel/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
