name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Match release tag to package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/client/package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}.`);
          }
          const table = JSON.parse(readFileSync('packages/table/package.json', 'utf8'));
          if (table.version !== version || table.peerDependencies['@nickwelsh/zero-for-laravel'] !== `^${version}`) {
            throw new Error('Client and table must share a version and matching client peer requirement.');
          }
          const prerelease = version.includes('-');
          if (prerelease !== (process.env.PRERELEASE === 'true')) {
            throw new Error('GitHub prerelease status must match the package version.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${prerelease ? 'next' : 'latest'}\n`);
          JS

  verify:
    needs: release
    uses: ./.github/workflows/ci.yml

  mirror-php:
    needs: verify
    uses: ./.github/workflows/sync-php.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.event.release.tag_name }}
    secrets:
      PHP_MIRROR_SSH_KEY: ${{ secrets.PHP_MIRROR_SSH_KEY }}

  publish:
    needs: [release, verify]
    strategy:
      fail-fast: false
      matrix:
        package: [client, table]
    env:
      NPM_DIST_TAG: ${{ needs.release.outputs.dist-tag }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickwelsh/zero-for-laravel build
      - run: pnpm --filter @nickwelsh/zero-table build
      - run: pnpm package:check
      - name: Check whether the table version needs publishing
        id: table
        if: matrix.package == 'table'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('packages/table/package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok && response.status !== 404) throw new Error(`npm returned ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${response.status === 404}\n`);
          JS
      - run: npm stage publish --access public --provenance --tag "$NPM_DIST_TAG"
        if: matrix.package == 'client' || steps.table.outputs.publish == 'true'
        working-directory: packages/${{ matrix.package }}

  docs:
    needs: [release, publish, mirror-php]
    if: needs.release.outputs.dist-tag == 'latest'
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.event.release.tag_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
